[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "metacritic-game-tracker"
version = "0.1.0"
description = "Hourly Metacritic games crawler with AI review summaries and a live monitoring dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "jinja2==3.1.6",
    "sse-starlette==2.3.3",
    "sqlalchemy==2.0.40",
    "alembic==1.15.2",
    "psycopg[binary]==3.2.6",
    "celery==5.5.2",
    "redis==5.2.1",
    "httpx==0.28.1",
    "selectolax==0.3.29",
    "pydantic-settings==2.9.1",
    "structlog==25.3.0",
    "playwright==1.52.0",
    "tzdata==2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
