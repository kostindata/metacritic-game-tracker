<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Игры{% endblock %} · Трекер игр</title>
  {# Everything is served by the app itself (no third-party CDNs in the critical path).
     Content-hashed URLs let browsers cache these files for a year. #}
  <link rel="preload" href="{{ static_url('vendor/fonts/onest-cyrillic.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ static_url('fonts.css') }}">
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
  <script src="{{ static_url('vendor/htmx-2.0.4.min.js') }}" defer></script>
  <script src="{{ static_url('vendor/htmx-ext-sse-2.2.2.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="/">Трекер игр</a>
      <nav class="nav" aria-label="Разделы">
        <a href="/" class="{% if request.url.path == '/' or request.url.path.startswith('/games') %}active{% endif %}">Игры</a>
        <a href="/dashboard" class="{% if request.url.path.startswith('/dashboard') %}active{% endif %}">Мониторинг</a>
      </nav>
      <div class="run-trigger">
        <span id="run-trigger-msg" aria-live="polite"></span>
        <button class="btn" hx-post="/runs" hx-target="#run-trigger-msg" hx-swap="innerHTML" title="Собрать новые игры с Metacritic сейчас">Запустить сбор</button>
      </div>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
